name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, openssl, xml, zip
          tools: composer:v2
      - name: Build production ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stage="$RUNNER_TEMP/jmo-stage/jocky-media-offloader"
          mkdir -p "$stage" build
          cp jocky-media-offloader.php uninstall.php readme.txt composer.json composer.lock "$stage/"
          cp -R src assets "$stage/"
          composer install --working-dir="$stage" --no-dev --no-interaction --prefer-dist --optimize-autoloader
          cd "$RUNNER_TEMP/jmo-stage"
          zip -qr "$GITHUB_WORKSPACE/build/jocky-media-offloader-$version.zip" jocky-media-offloader
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/jocky-media-offloader-*.zip --generate-notes
